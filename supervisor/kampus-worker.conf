# BUG 5 (w12): Konfigurasi Supervisor tidak ada atau belum terkonfigurasi!
# Tanpa berkas konfigurasi Supervisor di /etc/supervisor/conf.d/, antrean background worker
# tidak akan berjalan saat server VPS menyala ulang (reboot) atau jika worker crash.
# Akibatnya notifikasi email, tugas, dan nilai berhenti total tanpa ada pesan error di web.
#
# Solusi yang benar (aktifkan konfigurasi di bawah ini):
#
# [program:kampus-worker]
# process_name=%(program_name)s_%(process_num)02d
# command=php /var/www/kampus/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
# autostart=true
# autorestart=true
# stopasgroup=true
# killasgroup=true
# user=www-data
# numprocs=2
# redirect_stderr=true
# stdout_logfile=/var/www/kampus/storage/logs/worker.log
# stopwaitsecs=3600
