server {
    listen 80;
    server_name kampuslms.demo.id;

    # BUG 3 (w12): Document Root mengarah ke akar proyek!
    # Mengarahkan direktif 'root' ke /var/www/kampus menyebabkan seluruh berkas di luar folder public
    # dapat diunduh langsung lewat browser internet publik:
    # - https://kampuslms.demo.id/.env (Password database & APP_KEY terunduh!)
    # - https://kampuslms.demo.id/composer.json (Daftar paket dan dependensi)
    # - https://kampuslms.demo.id/storage/logs/laravel.log (Log error dan aktivitas sistem)
    #
    # Solusi:
    # root /var/www/kampus/public;
    root /var/www/kampus; # ❌ BUG 3: Mengarah ke akar proyek!

    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
